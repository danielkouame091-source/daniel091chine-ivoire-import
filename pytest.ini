[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
addopts =
    -ra
    --strict-markers
    --tb=short
    --disable-warnings
    --cov=app
    --cov-report=term-missing:skip-covered
    --cov-report=xml:coverage.xml
    --cov-fail-under=70
markers =
    unit: tests unitaires (pas de DB)
    integration: tests d'intégration (DB requise)
    e2e: tests bout-en-bout
    rls: tests d'isolation multi-tenant (RLS PostgreSQL)
filterwarnings =
    ignore::DeprecationWarning:passlib.*
    ignore::DeprecationWarning:pkg_resources.*
