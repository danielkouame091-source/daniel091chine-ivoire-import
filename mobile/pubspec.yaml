name: mtech_mobile
description: MTech SaaS SYSCOHADA — Application mobile dirigeants
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

  # ─── UI ────────────────────────────────────────────────
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  flutter_spinkit: ^5.2.1
  intl: ^0.19.0
  fl_chart: ^0.69.0

  # ─── Navigation ────────────────────────────────────────
  go_router: ^14.2.7

  # ─── State management ──────────────────────────────────
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # ─── Réseau ────────────────────────────────────────────
  dio: ^5.7.0
  connectivity_plus: ^6.0.5

  # ─── Modèles ───────────────────────────────────────────
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # ─── Stockage local ────────────────────────────────────
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.2

  # ─── Auth / Sécurité ───────────────────────────────────
  local_auth: ^2.3.0

  # ─── Caméra / OCR / Fichiers ──────────────────────────
  camera: ^0.11.0+2
  image_picker: ^1.1.2
  file_picker: ^8.1.2
  path_provider: ^2.1.4
  permission_handler: ^11.3.1

  # ─── Signature manuscrite ──────────────────────────────
  signature: ^5.5.0

  # ─── Notifications ─────────────────────────────────────
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^17.2.3
  url_launcher: ^6.3.1

  # ─── PDF ───────────────────────────────────────────────
  pdf: ^3.11.1
  printing: ^5.13.3

  # ─── Utilitaires ───────────────────────────────────────
  uuid: ^4.5.1
  logger: ^2.4.0
  package_info_plus: ^8.0.2
  device_info_plus: ^10.1.2
  share_plus: ^10.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # ─── Codegen ───────────────────────────────────────────
  build_runner: ^2.4.12
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.3
  hive_generator: ^2.0.1

  # ─── Tests ─────────────────────────────────────────────
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/lottie/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
