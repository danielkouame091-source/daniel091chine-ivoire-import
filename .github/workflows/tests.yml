name: Tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mtech
          POSTGRES_PASSWORD: mtech_dev_password
          POSTGRES_DB: mtech_test
        ports: ['5432:5432']
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -r requirements.txt
      - run: pytest -v --cov-fail-under=70
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://mtech:mtech_dev_password@localhost:5432/mtech_test
          JWT_PRIVATE_KEY: ${{ secrets.JWT_PRIVATE_KEY_TEST }}
          JWT_PUBLIC_KEY: ${{ secrets.JWT_PUBLIC_KEY_TEST }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY_TEST }}
